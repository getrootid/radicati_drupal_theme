form-styles:
  version: 1.x
  css:
    layout:
      dist/css/forms.css: {  }

component-base-styles:
  version: 1.x
  css:
    layout:
      dist/css/component.css: {  }
      dist/css/component--gap.css: {  }
      dist/css/component--padding.css: {  }
      dist/css/component--direction.css: {  }
      dist/css/component--align.css: {  }
      dist/css/component--section.css: {  }
      dist/css/component--content.css: {  }
      dist/css/component--field--title.css: {  }
      dist/css/component--field--sub-title.css: {  }
      dist/css/component--field--long-subtitle.css: {  }
      dist/css/component--blurb.css: {  }
      dist/css/component--slot--actions.css: {  }
      dist/css/component--card.css: {  }
      dist/css/component--spacing.css: {  }
      dist/css/component--style--light.css: {  }
      dist/css/component--style--dark.css: {  }
  dependencies:
    - radicati_drupal_theme/variables



fitvids:
  version: 2.x
  js:
    dist/libs/fitvids/scrollreveal.min.js: { minified: true }

stickybits:
  version: 1.x
  js:
    /libraries/stickybits/dist/stickybits.min.js: { minified: true }
  dependencies:
    - core/once

scroll-reveal:
  version: 4.x
  js:
    dist/libs/scrollreveal/scrollreveal.min.js: { minified: true }

scroll-spy:
  version: 3.x
  js:
    dist/js/vanillajs-scrollspy/vanillajs-scrollspy.min.js: { minified: true }

radicati-aos:
  version: 1.x
  js:
    assets/styles/20-molecules/001-aos/aos.js: { minified: false }
  dependencies:
    - radicati_drupal_theme/aos
    - core/once
    - core/drupal

aos:
  remote: https://github.com/michalsnik/aos
  version: 3.0.0-beta.6
  license:
    name: MIT
    url: https://github.com/michalsnik/aos/blob/next/LICENSE
    gpl-compatible: true
  css:
    theme:
      '//cdnjs.cloudflare.com/ajax/libs/aos/3.0.0-beta.6/aos.css': { type: external, minified: true }
  js:
    '//cdnjs.cloudflare.com/ajax/libs/aos/3.0.0-beta.6/aos.js': { type: external, minified: true }