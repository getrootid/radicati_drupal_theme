$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# This will likely need updating since keeping it as working
# in both EX and LB might be tricky/impossible.

name: Image
# replaces: radicati_drupal_theme:image
group: Content
weight: -3
props:
  type: object
  properties:
    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Image
      description: >
        Image of the singer
      examples:
        - src: 'micro.webp'
          alt: 'Nice picture of the singer'
          width: 200
          height: 300
    aspect_ratio:
      type: string
      title: Aspect Ratio
      description: Aspect ratio of the image
      enum:
        - 'original'
        - '1:1'
        - '4:3'
        - '16:9'
        - '3:2'
      default: 'original'
    caption:
      type: string
      title: Caption
      description: Caption for the image
      examples:
        - 'This is a caption for the image.'