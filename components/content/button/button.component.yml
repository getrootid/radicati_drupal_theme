$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Button
# replaces: radicati_drupal_theme:button
group: Content
props:
  type: object
  properties:
    button_text:
      type: ['string', 'null']
      title: Button Text
#    TODO: Verify this works. when I first tested it didn't, but that might just be canvas issues.
    url:
      type: ['string', 'null']
      title: Url
      description: The button url, can be either internal or external. Internal links should look like /about-us
      format: uri
    link_context:
      type: ['string', 'null']
      title: Link Context
      description: >
        Used to add additional context for screen readers. For example, a button that says "Learn more" Can add "about our services".
    button_style:
      type: ['string', 'null']
      title: Button Style
      default: "button button--black"
      #$ref: theme:/radicati_drupal_theme/schema-definitions.json#$defs/buttonStyles
      # having enum values here means that all future child themes have to include those values!!!
#      enum:
#        - "button button--white"
#        - "button button--black"
#        - "button button--gray"
#        - "button button--dark"
#        - "button button--light"
#        - "action-link"
#      meta:enum:
#        button button--white: White
#        button button--black: Black
#        button button--gray: Gray
#        button button--dark: Dark
#        button button--light: Light
#        action-link: Action Link
    new_tab:
      type: boolean
      title: Open in New Tab
      default: false
