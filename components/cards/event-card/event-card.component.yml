$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Event Card
#replaces: radicati_drupal_theme:event-card
group: Cards
props:
  type: object
  properties:
    title:
      type: ['string', 'object', 'null']
      title: Title
      description: "The title of the card, will display as an h2."
      default: "Our Snazzy Page"
    url:
      type: ['string', 'object', 'null']
      title: Link
      examples: [
        '/',
        "https://www.google.com",
        '/about-us'
      ]
    blurb:
      type: ['string', 'object', 'null']
      title: Blurb
    date:
      type: [ 'string', 'object', 'null' ]
      title: Date
      examples: [
        '1978-07-25',
        '2016-01-21',
        '1980-07-17'
      ]
    time:
      type: [ 'string', 'object', 'null' ]
      title: Time
      examples: [
        '7:00 PM UTC',
        '10:30 AM PST',
        '1:00 PM'
      ]
    is_all_day:
      type: ['boolean', 'null' ]
      title: All Day Event
      description: Whether the event lasts all day.
      default: false
    type:
      type: [ 'string', 'object', 'null' ]
      title: Type
      examples: [
        'Online',
        'Workshop',
        'Conference'
      ]
slots:
  media:
    title: Media



