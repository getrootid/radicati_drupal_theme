$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Icon Card
#replaces: radicati_drupal_theme:icon-card
group: Cards
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: "The title of the card, will display as an h2."
      default: "Our Snazzy Page"
    blurb:
      type: ['string', 'object', 'null']
      title: Blurb
      description: "A short description or tagline for the hero section."
      default: "Welcome to our awesome website where we do amazing things."
      contentMediaType: text/html
      examples:
        - '<p>Puppies deserve love too!</p>'
    link:
      type: string
      title: Link
      examples: [
        '/',
        "https://www.google.com",
        '/about-us'
      ]
    link_target:
      type: string
      title: Link
      enum: [
        '',
        "_blank",
        '_self'
      ]
      examples: [
        '',
        "_blank",
        '_self'
      ]
slots:
  media:
    title: Media