$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# TODO: Add a blurb field to the default install of this!


name: Highlight
#replaces: radicati_drupal_theme:highlight
props:
  type: object
  properties:
    color:
      type: string
      title: Color
      examples: [
        'primary'
      ]
      description: "Background color to use for the chip, one of 'primary' or 'secondary'."
      # The enum directive restricts the possible values in the element to our list.
      enum: ['primary', 'secondary']
slots:
  media:
    title: Media
  body:
    title: Content
