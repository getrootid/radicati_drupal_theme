$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Webform Call to Action
#replaces: radicati_drupal_theme:webform-cta
props:
  type: object
  properties:
    style:
      type: string
      title: Color
      examples: [
        'purple',
        'blue',
        'green'
      ]
      description: "Named style to use, generally using the background color as a reference."
      enum: ['purple', 'blue', 'green']
slots:
  background:
    title: Background
  body:
    title: Content
  form:
    title: Form
