$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# Current, this will always need to be a Drupal Block since it
# is outputting Drupal content. This means it can't easily directly interact
# with props, so....

name: Form Section
#replaces: radicati_drupal_theme:form-section
group: Page Sections
props:
  type: object
  properties:
    title:
      type: [ 'string', 'object', 'null' ]
      title: Title
      description: "The Call to Action Title, will be an H2."
      default: "Our Snazzy Page"
    subtitle:
      type: [ 'string', 'object', 'null' ]
      title: Sub-Title
      description: "A sub-title."
      default: ""
slots:
  form:
    title: Form Content
  actions:
    title: Actions
