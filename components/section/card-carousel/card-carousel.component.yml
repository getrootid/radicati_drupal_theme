$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# This uses the SplideJS library that should be installed.

name: Card Carousel
#replaces: radicati_drupal_theme:card-carousel
group: Page Sections
props:
  type: object
  properties:
    content_attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper attributes.
    style:
      type: string
      title: Style
      description: >
        The style of the Call to Action section.
    # Style will need to work really different in LB than in Canvas
    title:
      type: string
      title: Title
      description: "The section title, will be an H2."
      default: "Our Snazzy Page"
    subtitle:
      type: string
      title: Sub-Title
      description: "A sub-title."
      default: ""
slots:
  cards:
    title: Cards
    allowedComponents:
      - radicati_drupal_theme:collection-card
  readmore:
    title: Read More Link
