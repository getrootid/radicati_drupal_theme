$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: People Listing
#replaces: radicati_drupal_theme:people-listing
group: Page Sections

props:
  type: object
  properties:
    content_attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper attributes.
    title:
      type: ['string', 'null']
      title: Title
      description: "The section title, will be an H2."
      default: "Our Content Listing"
    subtitle:
      type: ['string', 'null']
      title: Sub-Title
      description: "A sub-title."
      default: ""
    style:
      type: string
      title: Style
      description: >
        The style of the section.
slots:
  detail_items:
    title: Detail Items
  simple_items:
    title: Simple Items
