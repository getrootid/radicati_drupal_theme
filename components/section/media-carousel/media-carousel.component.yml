$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# This uses the SplideJS library that should be installed.

name: Media Carousel
#replaces: radicati_drupal_theme:media-carousel
props:
  type: object
  properties:
    style:
      type: string
      title: Color
      examples: [
        'purple',
        'blue',
        'green'
      ]
      description: "Named style to use, generally using the background color as a reference."
      enum: ['purple', 'blue', 'green']
slots:
  title:
    title: Title
  body:
    title: Content
  items:
    title: Media Items
  readmore:
    title: Read More Link
