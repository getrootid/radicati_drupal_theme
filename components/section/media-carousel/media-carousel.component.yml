$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# This uses the SplideJS library that should be installed.

name: Media Carousel
#replaces: radicati_drupal_theme:media-carousel
group: Page Sections

props:
  type: object
  properties:
    content_attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper attributes.
    title:
      type: string
      title: Title
      description: "The Call to Action Title, will be an H2."
      default: "Section Title"
    display_carousel:
      type: boolean
      title: Display Carousel
      description: "Whether to display the media items in a carousel or as a grid."
      default: true
slots:
  items:
    title: Media Items
  actions:
    title: Actions
