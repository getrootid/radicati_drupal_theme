$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Icon Grid
#replaces: radicati_drupal_theme:icon-grid
props:
  type: object
  properties:
    style:
      type: string
      title: Color
      examples: [
        'purple',
        'blue',
        'green'
      ]
      description: "Named style to use, generally using the background color as a reference."
      enum: ['purple', 'blue', 'green']
    items_per_row:
      type: string
      title: Items Per Row
      examples: [
        'three',
        'four',
        'five'
      ]
      description: "Number of items to show per row."
      enum: ["one", "two", "three", "four", "five", "six"]
slots:
  header:
    title: Header
  icons:
    title: Content
  actions:
    title: Actions
