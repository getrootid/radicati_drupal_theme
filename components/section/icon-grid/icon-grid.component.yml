$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Icon Grid
#replaces: radicati_drupal_theme:icon-grid
group: Page Sections

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: "Is both the title displayed and the page's main title for accessibility."
      default: "Our Snazzy Page"
    blurb:
      type: ['string', 'object', 'null']
      title: Blurb
      description: "A short description or tagline for the hero section."
      default: ""
      contentMediaType: text/html
      examples:
        - '<p>Puppies deserve love too!</p>'
    style:
      type: string
      title: Style
      description: >
        The style of the Call to Action section.
    items_per_row:
      type: string
      title: Items Per Row
      examples: [
        'setting--items-per-row--two',
        'setting--items-per-row--three',
        'setting--items-per-row--four'
      ]
      enum: [
        'setting--items-per-row--two',
        'setting--items-per-row--three',
        'setting--items-per-row--four',
        'setting--items-per-row--five',
        'setting--items-per-row--six'
      ]
      meta:enum:
        setting--items-per-row--two: Two
        setting--items-per-row--three: Three
        setting--items-per-row--four: Four
        setting--items-per-row--five: Five
        setting--items-per-row--six: Six
slots:
  icons:
    title: Content
  actions:
    title: Actions
