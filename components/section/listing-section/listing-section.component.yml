$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# This is based on Views and is unlikely to change in Canvas, since what we want
# is data being rendered from Drupal.

# TODO: Find a way to respect the view display type.

name: Listing Section
#replaces: radicati_drupal_theme:listing-section
group: Page Sections
noUi: true
props:
  type: object
  properties:
    content_attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper attributes.
    title:
      type: string
      title: Title
      description: "The section title, will be an H2."
      default: "Our Content Listing"
    subtitle:
      type: string
      title: Sub-Title
      description: "A sub-title."
      default: ""
    style:
      type: string
      title: Style
      description: >
        The style of the section.
slots:
  listing_view:
    title: Listing View
    description: The listing View that contains the content.
  actions:
    title: Actions
