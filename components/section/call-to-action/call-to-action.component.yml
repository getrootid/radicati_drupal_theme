$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Call to Action
#replaces: radicati_drupal_theme:call-to-action
group: Page Sections
props:
  type: object
  properties:
    content_attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper attributes.
#    image:
#      $ref: json-schema-definitions://canvas.module/image
#      type: [ 'object', 'string' ]
#      title: Image
#      description: >
#        Some beautiful background image for the hero section.
#      examples:
#        - src: 'https://picsum.photos/1200/600'
#          alt: 'Some kind of pictograph'
#          width: 1200
#          height: 600
    title:
      type: ['string', 'object', 'null']
      title: Title
      description: "The Call to Action Title, will be an H2."
      default: "Our Snazzy Page"
    subtitle:
      type: ['string', 'object', 'null']
      title: Sub-Title
      description: "A sub-title."
      default: ""
    label:
      type: ['string', 'object', 'null']
      title: Label
      description: "Extra information, something meant to catch the reader's eye."
      default: ""
    blurb:
      type: ['string', 'object', 'null']
      title: Blurb
      description: "A short description or tagline for the hero section."
      default: ""
      contentMediaType: text/html
      examples:
        - '<p>Puppies deserve love too!</p>'
    alignment:
      type: ['string', 'object', 'null']
      title: Content Alignment
      description: This should only be used by Layout Builder.
    style:
      type: ['string', 'object', 'null']
      title: Style
      description: >
        The style of the Call to Action section.
# Style will need to work really different in LB than in Canvas
# For now, assume we're in LB and don't use an enum.

