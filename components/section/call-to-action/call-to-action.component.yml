$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Call to Action
#replaces: radicati_drupal_theme:call-to-action
group: Page Sections
props:
  type: object
  properties:
    content_attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper attributes.
    image:
      $ref: json-schema-definitions://canvas.module/image
      type: [ 'object', 'string' ]
      title: Image
      description: >
        Some beautiful background image for the hero section.
      examples:
        - src: 'https://picsum.photos/1200/600'
          alt: 'Some kind of pictograph'
          width: 1200
          height: 600
    title:
      type: string
      title: Title
      description: "The Call to Action Title, will be an H2."
      default: "Our Snazzy Page"
    blurb:
      type: ['string', 'object', 'null']
      title: Blurb
      description: "A short description or tagline for the hero section."
      default: ""
      contentMediaType: text/html
      examples:
        - '<p>Puppies deserve love too!</p>'
    content_position:
      type: string
      title: Content Position
      description: Position of the content inside this section.
      enum:
        - setting--content-layout--center
        - setting--content-layout--left
        - setting--content-layout--right
      meta:enum:
        setting--content-layout--center: Center
        setting--content-layout--left: Left
        setting--content-layout--right: Right
      default: setting--content-layout--center
slots:
  actions:
    title: Actions
