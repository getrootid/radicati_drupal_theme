$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Card Collection
#replaces: radicati_drupal_theme:card-collection
props:
  type: object
  properties:
    items_per_row:
      type: string
      title: Items Per Row
      examples: [
        'two',
        'three',
        'four'
      ]
      enum: [
        'two',
        'three',
        'four',
        'five',
        'six'
      ]
    style:
      type: string
      title: Color
      examples: [
        'purple',
        'blue',
        'green'
      ]
      description: "Named style to use, generally using the background color as a reference."
      enum: ['purple', 'blue', 'green']
slots:
  header:
    title: Header
  cards:
    title: Cards
  readmore:
    title: Read More Link
