$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Card Collection
#replaces: radicati_drupal_theme:card-collection
group: Page Sections
props:
  type: object
  properties:
    content_attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper attributes.
    title:
      type: string
      title: Title
      description: "The Call to Action Title, will be an H2."
      default: "Section Title"
    blurb:
      type: [ 'string', 'object', 'null' ]
      title: Blurb
      description: "A short description or tagline for this section."
      default: ""
      contentMediaType: text/html
      examples:
        - '<p>This is a nice collection of items.</p>'
    items_per_row:
      type: string
      title: Items Per Row
      examples: [
        'two',
        'three',
        'four'
      ]
      enum: [
        'two',
        'three',
        'four',
        'five',
        'six'
      ]
      meta:enum:
        two: Two
        three: Three
        four: Four
        five: Five
        six: Six
slots:
  cards:
    title: Cards
    description: The cards to be displayed in this collection.
  actions:
    title: Actions
