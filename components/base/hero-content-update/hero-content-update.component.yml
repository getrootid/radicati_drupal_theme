$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Hero Content Update
#replaces: radicati_drupal_theme:hero-content-update
noUi: true
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: "A title for the content update."
      default: "Parks are Fun for Everyone!"
    blurb:
      type: string
      title: Highlight Label
      contentMediaType: text/html
      examples:
        - '<p>This is a paragraph with <strong>bold</strong> text.</p><ul><li>List item 1</li><li>List item 2</li></ul>'
    url:
      type: ['string', 'null']
      title: Highlight Link URL
      examples: [
          '/about-us',
          'https://example.com/contact'
      ]